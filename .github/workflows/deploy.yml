# Build the Astro site on every push to main and publish the output to the gh-pages branch,
# which is what GitHub Pages serves. No manual `git push origin main:gh-pages` needed any more.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish dist/ to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch gh-pages "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          # Replace everything except git metadata with the fresh build (keeps branch history, no force-push).
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r dist/. site/
          touch site/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to deploy."; exit 0; fi
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push origin gh-pages
